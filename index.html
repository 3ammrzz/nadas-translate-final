<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nada Translate - «·‰”Œ… «·«Õ —«›Ì…</title>
    <style>
        :root {
            --bg: #f5f7fa;
            --card: rgba(255, 255, 255, 0.7);
            --text: #2d3436;
            --accent: #6c5ce7;
            --border: rgba(226, 232, 240, 0.8);
            --textarea-bg: rgba(250, 250, 250, 0.8);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --accent: #a29bfe;
            --border: rgba(51, 65, 85, 0.8);
            --textarea-bg: rgba(15, 23, 42, 0.6);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: background 0.4s ease, color 0.4s ease;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .header { 
            padding: 40px 20px; 
            text-align: center; 
            position: relative; 
            width: 100%; 
            max-width: 1000px; 
        }
        
        .theme-toggle {
            position: absolute;
            top: 40px;
            left: 20px;
            cursor: pointer;
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
        }

        .main-container {
            width: 90%;
            max-width: 1000px;
            background: var(--card);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 30px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }

        select, .file-btn {
            background: var(--textarea-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 14px;
            outline: none;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
        }

        select:hover { border-color: var(--accent); }

        .swap-btn {
            background: var(--accent);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .swap-btn:hover { transform: rotate(180deg); opacity: 0.9; }

        .translation-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .box-wrapper { position: relative; }

        textarea, .output-box {
            width: 100%;
            height: 300px;
            border: 1px solid var(--border);
            padding: 20px;
            font-size: 18px;
            border-radius: 20px;
            background: var(--textarea-bg);
            color: var(--text);
            resize: none;
            outline: none;
            box-sizing: border-box;
            line-height: 1.6;
            transition: border 0.3s;
        }

        textarea:focus { border-color: var(--accent); }

        .voice-btn {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: var(--accent);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .voice-btn:hover { transform: scale(1.1); }

        .footer-tools {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .btn-main {
            background: var(--accent);
            color: white;
            padding: 14px 40px;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.2);
        }
        
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(108, 92, 231, 0.3); }

        @media (max-width: 768px) { 
            .translation-grid { grid-template-columns: 1fr; } 
            .swap-btn { transform: rotate(90deg); }
            .swap-btn:hover { transform: rotate(270deg); }
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="theme-toggle" onclick="toggleTheme()">?? «·Ê÷⁄ «··Ì·Ì</button>
        <h1 style="margin:0; font-size: 2.5rem;">Nada <span style="font-weight:300; color: var(--accent);">Translate</span></h1>
        <p style="opacity:0.7; margin-top: 10px;">„ —Ã„ –ﬂÌ Ê ’„Ì„ “Ã«ÃÌ ⁄’—Ì</p>
    </div>

    <div class="main-container">
        <div class="controls">
            <select id="sourceLang">
                <option value="en">«·≈‰Ã·Ì“Ì…</option>
                <option value="ar">«·⁄—»Ì…</option>
                <option value="fr">«·›—‰”Ì…</option>
                <option value="de">«·√·„«‰Ì…</option>
            </select>

            <button class="swap-btn" onclick="swapLangs()" title=" »œÌ· «··€« ">?</button>

            <select id="targetLang">
                <option value="ar" selected>«·⁄—»Ì…</option>
                <option value="en">«·≈‰Ã·Ì“Ì…</option>
                <option value="fr">«·›—‰”Ì…</option>
                <option value="de">«·√·„«‰Ì…</option>
            </select>
            
            <label class="file-btn" for="fileInput">?? —›⁄ „·› ‰’Ì</label>
            <input type="file" id="fileInput" hidden accept=".txt">
        </div>

        <div class="translation-grid">
            <div class="box-wrapper">
                <textarea id="inputText" placeholder="«»œ√ «·ﬂ «»… Â‰« ·· —Ã„…..."></textarea>
                <button class="voice-btn" onclick="speak('inputText', 'sourceLang')" title="‰ÿﬁ">??</button>
            </div>
            
            <div class="box-wrapper">
                <div id="outputText" class="output-box">«· —Ã„… ” ŸÂ— Â‰«  ·ﬁ«∆Ì«...</div>
                <button class="voice-btn" onclick="speak('outputText', 'targetLang')" title="‰ÿﬁ">??</button>
            </div>
        </div>

        <div class="footer-tools">
            <button class="btn-main" onclick="copyText()">‰”Œ «·‰’ «·„ —Ã„</button>
            <button onclick="clearAll()" style="background:none; border:none; color:var(--text); cursor:pointer; font-weight:500;">??? „”Õ «·ﬂ·</button>
        </div>
    </div>

    <script>
        // ≈’·«Õ Ê Õ”Ì‰ «·Ê÷⁄ «··Ì·Ì
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.querySelector('.theme-toggle');
            if (html.getAttribute('data-theme') === 'light') {
                html.setAttribute('data-theme', 'dark');
                btn.innerText = "?? «·Ê÷⁄ «·‰Â«—Ì";
            } else {
                html.setAttribute('data-theme', 'light');
                btn.innerText = "?? «·Ê÷⁄ «··Ì·Ì";
            }
        }

        // „Ì“…  »œÌ· «··€« 
        function swapLangs() {
            const s = document.getElementById('sourceLang');
            const t = document.getElementById('targetLang');
            const val = s.value;
            s.value = t.value;
            t.value = val;
            translate();
        }

        // —›⁄ «·„·›« 
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('inputText').value = e.target.result;
                translate();
            };
            reader.readAsText(file);
        });

        // ÊŸÌ›… «· —Ã„… «·√”«”Ì…
        async function translate() {
            const text = document.getElementById('inputText').value;
            const outputDiv = document.getElementById('outputText');
            
            if(!text.trim()) {
                outputDiv.innerText = "«· —Ã„… ” ŸÂ— Â‰«  ·ﬁ«∆Ì«...";
                return;
            }

            outputDiv.innerText = "Ã«—Ì «· —Ã„…...";
            
            const s = document.getElementById('sourceLang').value;
            const t = document.getElementById('targetLang').value;
            
            try {
                const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${s}|${t}`);
                const d = await r.json();
                outputDiv.innerText = d.responseData.translatedText;
            } catch(e) { 
                outputDiv.innerText = "⁄–—«° ÕœÀ Œÿ√ ›Ì «·« ’«·. Õ«Ê· „—… √Œ—Ï.";
            }
        }

        // «·‰ÿﬁ «·’Ê Ì
        function speak(id, langId) {
            const el = document.getElementById(id);
            const text = el.value || el.innerText;
            if(!text || text.includes("...")) return;
            
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = document.getElementById(langId).value;
            window.speechSynthesis.speak(msg);
        }

        //  √ŒÌ— «· —Ã„… √À‰«¡ «·ﬂ «»… (Debounce)
        let timer;
        document.getElementById('inputText').addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(translate, 800);
        });

        // ‰”Œ «·‰’
        function copyText() {
            const text = document.getElementById('outputText').innerText;
            if(text.includes("...")) return;
            navigator.clipboard.writeText(text);
            alert(" „ ‰”Œ «· —Ã„… »‰Ã«Õ!");
        }

        // „”Õ ﬂ· ‘Ì¡
        function clearAll() {
            document.getElementById('inputText').value = "";
            document.getElementById('outputText').innerText = "«· —Ã„… ” ŸÂ— Â‰«  ·ﬁ«∆Ì«...";
            window.speechSynthesis.cancel();
        }
    </script>
</body>
</html>
